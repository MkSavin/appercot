name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  plan:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[a-zA-Z0-9]+([.-][a-zA-Z0-9]+)*)?$ ]]; then
            echo "::error::Invalid release version $version"
            exit 1
          fi
          tag="v$version"
          channel=latest
          if [[ "$version" == *-* ]]; then channel=beta; fi
          release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | [.draft, .target_commitish, .id, (.assets | length)] | @tsv")
          read -r draft target release_id asset_count <<< "$release"
          publish=true
          if [[ "$draft" == true ]]; then
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              if [[ "$asset_count" != 0 || "$GITHUB_SHA" != "$(git rev-parse refs/remotes/origin/master)" ]] ||
                 git show-ref --verify --quiet "refs/tags/$tag" ||
                 ! git merge-base --is-ancestor "$target" "$GITHUB_SHA"; then
                echo "::error::Release $tag is in progress for $target. Rerun that release workflow."
                exit 1
              fi
              for package in protocol chat; do
                status=$(curl --silent --show-error --max-time 15 --header 'Cache-Control: no-cache' \
                  --output /dev/null --write-out '%{http_code}' \
                  "https://registry.npmjs.org/@appercot%2f$package/$version")
                if [[ "$status" != 404 ]]; then
                  echo "::error::Cannot move draft $tag. npm returned HTTP $status for @appercot/$package@$version."
                  exit 1
                fi
              done
              updated_target=$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                -f "target_commitish=$GITHUB_SHA" --jq '.target_commitish')
              if [[ "$updated_target" != "$GITHUB_SHA" ]]; then
                echo "::error::GitHub did not move draft $tag to $GITHUB_SHA."
                exit 1
              fi
              echo "Moved unpublished draft $tag from $target to $GITHUB_SHA"
            fi
          elif [[ "$draft" == false ]] || git show-ref --verify --quiet "refs/tags/$tag"; then
            publish=false
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --generate-notes --draft
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "channel=$channel"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  npm:
    needs: [verify, plan]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org npm@11.21.3
      - uses: actions/download-artifact@v8
        with:
          name: release-build
          path: dist
      - name: Publish the SDK packages
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: node scripts/publish-sdk.mjs "$RELEASE_VERSION" "$RELEASE_CHANNEL" dist/npm

  image:
    needs: [verify, plan, npm]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.plan.result == 'success' && (needs.npm.result == 'success' || needs.npm.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=master
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ needs.plan.outputs.publish == 'true' && needs.plan.outputs.channel == 'latest' }}
            type=raw,value=${{ needs.plan.outputs.tag }},enable=${{ needs.plan.outputs.publish == 'true' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [plan, npm, image]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-build
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
        shell: bash
        run: |
          args=(--latest)
          if [[ "$RELEASE_CHANNEL" == beta ]]; then args=(--prerelease --latest=false); fi
          gh release upload "$RELEASE_TAG" dist/appercot-linux-x64.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${args[@]}"
