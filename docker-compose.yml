services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      BOOTSTRAP_INVITE: ${BOOTSTRAP_INVITE:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ALLOW_USER_INVITES: ${ALLOW_USER_INVITES:-true}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-2147483648}
      MEDIA_UPLOADS_PER_ACTOR: ${MEDIA_UPLOADS_PER_ACTOR:-3}
      MEDIA_ORIGINALS_PER_USER: ${MEDIA_ORIGINALS_PER_USER:-4}
      MEDIA_TRUSTED_HOSTS: ${MEDIA_TRUSTED_HOSTS:-}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-appercot}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-appercot}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - appercot-data:/data
    expose:
      - "3000"

  minio:
    image: appercot-minio:community
    build:
      context: .
      dockerfile: Dockerfile.minio
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-appercot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BROWSER: "off"
    volumes:
      - appercot-media:/data

  minio-init:
    image: appercot-minio:community
    pull_policy: never
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-appercot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-appercot}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for attempt in $$(seq 1 30); do
          if mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 &&
             mc mb --ignore-existing "local/$$S3_BUCKET"; then
            exit 0
          fi
          sleep 2
        done
        exit 1

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  appercot-data:
  appercot-media:
  caddy-data:
  caddy-config:
