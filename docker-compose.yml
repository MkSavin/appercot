services:
  app:
    image: ghcr.io/mksavin/appercot:${APPERCOT_VERSION:?Set APPERCOT_VERSION in .env}
    restart: unless-stopped
    depends_on:
      garage:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      BOOTSTRAP_INVITE: ${BOOTSTRAP_INVITE:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ALLOW_USER_INVITES: ${ALLOW_USER_INVITES:-true}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-2147483648}
      MEDIA_UPLOADS_PER_ACTOR: ${MEDIA_UPLOADS_PER_ACTOR:-3}
      MEDIA_ORIGINALS_PER_USER: ${MEDIA_ORIGINALS_PER_USER:-4}
      MEDIA_TRUSTED_HOSTS: ${MEDIA_TRUSTED_HOSTS:-}
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET: ${S3_BUCKET:-appercot}
      S3_REGION: garage
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - appercot-data:/data
    expose:
      - "3000"

  garage:
    image: dxflrs/garage:v2.5.0
    command: /garage server --single-node --default-bucket
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-appercot}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  appercot-data:
  garage-data:
  caddy-data:
  caddy-config:
