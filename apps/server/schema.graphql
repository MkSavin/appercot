type Bot {
  description: String!
  id: ID!
  listed: Boolean!
  name: String!
  online: Boolean!
  username: String!
}

type BotCommand {
  description: String!
  name: String!
}

type BotToken {
  bot: Bot!
  token: String!
}

type ButtonResult {
  toast: String
}

type Connection {
  blocked: Boolean!
  bot: Bot!
  commands: [BotCommand!]!
  createdAt: Float!
  id: ID!
  lastMessageAt: Float
  roles: [String!]!
  unread: Int!
}

type Invite {
  code: String!
  maxUses: Int
  url: String!
  uses: Int!
}

scalar JSON

type Message {
  chatId: ID!
  content: JSON!
  createdAt: Float!
  editedAt: Float
  id: ID!
  replyTo: ID
  sender: String!
  seq: Int!
  status: String!
}

type Mutation {
  addBot(username: String!): Connection!
  blockBot(blocked: Boolean!, chatId: ID!): Boolean!
  clearChat(chatId: ID!): Boolean!
  createBot(description: String!, name: String!, username: String!): BotToken!
  createInvite(expiresInDays: Int, maxUses: Int): Invite!
  login(password: String!, username: String!): Session!
  logout: Boolean!
  markRead(chatId: ID!, seq: Int!): Boolean!
  pressButton(chatId: ID!, data: String!, messageId: ID!): ButtonResult!
  register(displayName: String!, invite: String!, password: String!, username: String!): Session!
  resetBotToken(botId: ID!): BotToken!
  sendMessage(input: SendMessageInput!): Message!
  setBotListed(botId: ID!, listed: Boolean!): Boolean!
  setBotOwner(botId: ID!, username: String): Boolean!
}

type Query {
  adminBots: [Bot!]!
  adminInvites: [Invite!]!
  adminUsers(query: String): [User!]!
  browseBots(query: String): [Bot!]!
  messages(before: Int, chatId: ID!, limit: Int = 50): [Message!]!
  session: Session!
  sync(since: Int!): SyncPayload!
}

input SendMessageInput {
  chatId: ID!
  clientId: String!
  content: JSON!
}

type Session {
  chats: [Connection!]!
  user: User!
  vapidPublicKey: String
}

type SyncPayload {
  resetRequired: Boolean!
  updates: [Update!]!
}

type Update {
  payload: JSON!
  seq: Int!
}

type User {
  displayName: String!
  id: ID!
  isAdmin: Boolean!
  username: String!
}
